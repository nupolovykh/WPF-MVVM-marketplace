name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Domain, EntityFramework and the console playground target plain net6.0 with
  # no Windows-only APIs, so they build (and restore) on Linux. Keeping them in
  # a separate Linux job means a broken data/domain layer is caught without
  # waiting on a Windows runner.
  build-portable:
    name: build (linux, ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Domain
            path: Marketplace.Domain/Marketplace.Domain.csproj
          - name: EntityFramework
            path: Marketplace.EntityFramework/Marketplace.EntityFramework.csproj
          - name: Marketplace.Playground
            path: Marketplace.Playground/Marketplace.Playground.csproj
          - name: SmokeTest
            path: Marketplace.SmokeTest/Marketplace.SmokeTest.csproj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore "${{ matrix.path }}"
      - run: dotnet build "${{ matrix.path }}" --no-restore -c Release

  # The WPF head is net6.0-windows and needs the Windows Desktop SDK, which only
  # exists on Windows runners - so the full solution is built there.
  build-desktop:
    name: build (windows, solution)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Marketplace.sln
      - run: dotnet build Marketplace.sln --no-restore -c Release

  # A build proves the code compiles, not that it works. This runs the domain and
  # data layers against a real (throwaway) SQLite database: EnsureCreated with
  # the full seed, PBKDF2 login for a seeded account, a register -> login round
  # trip, the profile save that must keep an unchanged password, and the
  # catalogue paging/search queries. No WPF is involved, so it runs on Linux.
  smoke-test:
    name: functional smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project Marketplace.SmokeTest/Marketplace.SmokeTest.csproj -c Release

  # Renders each screen headlessly - no Show(), no message loop - and uploads the
  # PNGs. Marked non-blocking: the harness drives the real host and database, so
  # it is the most fragile part of the pipeline and should not gate a build.
  screenshot:
    name: screenshot (${{ matrix.screen }})
    runs-on: windows-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        screen: [authorization, registration, home, profile, statistics, delivery]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project Marketplace.Wpf.Screenshot/Marketplace.Wpf.Screenshot.csproj -c Release -- "${{ runner.temp }}/${{ matrix.screen }}.png" "${{ matrix.screen }}"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ matrix.screen }}
          path: ${{ runner.temp }}/${{ matrix.screen }}.png
          if-no-files-found: error

  # Commits the rendered screens into docs/img/ so they are viewable on GitHub and
  # embeddable in the README, instead of expiring with the CI artifacts. One job
  # rather than a matrix, so there is only ever a single commit and no push race.
  publish-screenshots:
    name: publish screenshots to repo
    needs: [screenshot]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: screenshot-*
          path: screenshots-download
      - name: Copy screenshots into docs/img and commit
        shell: bash
        env:
          TARGET_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          mkdir -p docs/img

          for screen in authorization registration home profile statistics delivery; do
            src=$(find "screenshots-download/screenshot-${screen}" -type f -name '*.png' 2>/dev/null | head -1)
            if [ -z "$src" ]; then
              echo "::warning::no screenshot artifact for ${screen}, skipping"
              continue
            fi
            cp "$src" "docs/img/${screen}.png"
            git add -- "docs/img/${screen}.png"
          done

          git config user.name "nupolovykh"
          git config user.email "96892429+nupolovykh@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No screenshot changes to commit"
          else
            git commit -m "Update generated screenshots [skip ci]"
            git push origin "HEAD:${TARGET_REF}"
          fi
