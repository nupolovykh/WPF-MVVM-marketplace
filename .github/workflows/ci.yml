name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Domain, EntityFramework and the console playground target plain net6.0 with
  # no Windows-only APIs, so they build (and restore) on Linux. Keeping them in
  # a separate Linux job means a broken data/domain layer is caught without
  # waiting on a Windows runner.
  build-portable:
    name: build (linux, ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Domain
            path: MyWpfAppForDb.Domain/MyWpfAppForDb.Domain.csproj
          - name: EntityFramework
            path: MyWpfAppForDb.EntityFramework/MyWpfAppForDb.EntityFramework.csproj
          - name: Console.Playground
            path: Console.Playground/Console.Playground.csproj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore "${{ matrix.path }}"
      - run: dotnet build "${{ matrix.path }}" --no-restore -c Release

  # The WPF head is net6.0-windows and needs the Windows Desktop SDK, which only
  # exists on Windows runners - so the full solution is built there.
  build-desktop:
    name: build (windows, solution)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore MyWpfAppForDb.sln
      - run: dotnet build MyWpfAppForDb.sln --no-restore -c Release
